<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopBoard</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="/">ShopBoard</a>
      <nav aria-label="Main">
        <a href="#products">Shop</a>
        <a href="#register">Sign up</a>
      </nav>
      <p class="cart">Cart: <span id="cart-count">0</span></p>
    </header>
    <main>
      <section class="hero">
        <h1>Sell smarter.</h1>
        <p>Everything your shop needs, in one board.</p>
      </section>
      <section id="products" aria-labelledby="products-title">
        <h2 id="products-title">Products</h2>
        <div class="grid">
          <article class="card">
            <h3>Leather Tote Bag</h3>
            <p class="price">$89</p>
            <button type="button">Add to cart</button>
          </article>
          <article class="card">
            <h3>White Sneakers</h3>
            <p class="price">$75</p>
            <button type="button">Add to cart</button>
          </article>
          <article class="card">
            <h3>Wool Scarf</h3>
            <p class="price">$25</p>
            <button type="button">Add to cart</button>
          </article>
        </div>
      </section>
    </main>
    <footer>
      <p>© 2026 ShopBoard</p>
    </footer>
  </body>
</html>
